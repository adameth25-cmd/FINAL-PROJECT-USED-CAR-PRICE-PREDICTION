<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Used Car Price Prediction</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: linear-gradient(135deg, #0B1C2C, #112B3C);
  color: white;
  padding: 30px;
}

/* HEADER */
.header {
  text-align: center;
  margin-bottom: 30px;
}

.header h1 {
  color: #00C2CB;
  font-size: 32px;
}

.header p {
  color: #aaa;
  margin-top: 5px;
}

/* MAIN */
.main {
  display: flex;
  gap: 25px;
  justify-content: center;
  align-items: flex-start;
}

/* LEFT PANEL */
.left {
  width: 60%;
}

.card {
  background: rgba(17, 43, 60, 0.9);
  padding: 25px;
  border-radius: 18px;
  margin-bottom: 20px;
  border: 1px solid rgba(0,194,203,0.2);
  backdrop-filter: blur(10px);
  transition: 0.3s;
}

.card:hover {
  box-shadow: 0 0 25px rgba(0,194,203,0.2);
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

label {
  font-size: 13px;
  color: #ccc;
}

/* INPUTS */
input, select {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  border-radius: 10px;
  border: none;
  background: #0B1C2C;
  color: white;
  outline: none;
  transition: 0.2s;
}

input::placeholder {
  color: #777;
}

input:focus, select:focus {
  border: 1px solid #00C2CB;
  box-shadow: 0 0 10px rgba(0,194,203,0.3);
}

/* BUTTON */
button {
  width: 100%;
  padding: 16px;
  background: linear-gradient(135deg, #00C2CB, #009fa5);
  border: none;
  border-radius: 12px;
  color: #0B1C2C;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
  margin-top: 10px;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.03);
  box-shadow: 0 0 20px rgba(0,194,203,0.5);
}

/* RIGHT PANEL */
.right {
  width: 30%;
  background: rgba(17, 43, 60, 0.9);
  border-radius: 18px;
  padding: 25px;
  text-align: center;
  border: 1px solid rgba(0,194,203,0.2);
  backdrop-filter: blur(10px);
}

.result-title {
  color: #aaa;
  font-size: 14px;
}

.result-value {
  font-size: 38px;
  color: #00C2CB;
  margin-top: 30px;
  opacity: 0;
  transition: 0.5s ease;
}

/* SPINNER */
.spinner {
  margin: 25px auto;
  width: 35px;
  height: 35px;
  border: 4px solid #ccc;
  border-top: 4px solid #00C2CB;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}

</style>
</head>

<body>

<div class="header">
  <h1>Used Car Price Prediction</h1>
  <p>AI-powered valuation system</p>
</div>

<div class="main">

  <div class="left">
    <div class="card">
      <h3>Car Details</h3>
      <div class="grid">

        <div>
          <label>Brand</label>
          <select id="brand">
            <option>Toyota</option>
            <option>BMW</option>
            <option>Ford</option>
          </select>
        </div>

        <div>
          <label>Year</label>
          <input type="number" id="year" placeholder="e.g. 2020">
        </div>

        <div>
          <label>Engine Size</label>
          <input type="number" id="engine" placeholder="e.g. 2.0">
        </div>

        <div>
          <label>Mileage</label>
          <input type="number" id="mileage" placeholder="e.g. 50000">
        </div>

        <div>
          <label>Fuel Type</label>
          <select id="fuel">
            <option>Petrol</option>
            <option>Diesel</option>
          </select>
        </div>

        <div>
          <label>Transmission</label>
          <select id="transmission">
            <option>Manual</option>
            <option>Automatic</option>
          </select>
        </div>

        <div>
          <label>Owners</label>
          <input type="number" id="owners" placeholder="e.g. 1">
        </div>

      </div>
    </div>

    <button onclick="predict()">Predict Price</button>
  </div>

  <div class="right">
    <p class="result-title">PREDICTION OUTPUT</p>
    <div id="result" class="result-value">--</div>
  </div>

</div>

<script>
async function predict() {
  const resultDiv = document.getElementById("result");

  resultDiv.style.opacity = 0;
  resultDiv.innerHTML = "<div class='spinner'></div>";

  const data = {
    brand: document.getElementById("brand").value,
    year: parseInt(document.getElementById("year").value),
    engine_size: parseFloat(document.getElementById("engine").value),
    mileage: parseInt(document.getElementById("mileage").value),
    fuel_type: document.getElementById("fuel").value,
    transmission: document.getElementById("transmission").value,
    owners: parseInt(document.getElementById("owners").value)
  };

        const response = await fetch("https://final-project-used-car-price-prediction.onrender.com", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

    const result = await response.json();

    resultDiv.innerHTML = "$ " + result.predicted_price;

    setTimeout(() => {
      resultDiv.style.opacity = 1;
    }, 200);

  } catch (error) {
    resultDiv.innerHTML = "Error";
    resultDiv.style.opacity = 1;
  }
}
</script>

</body>
</html>
